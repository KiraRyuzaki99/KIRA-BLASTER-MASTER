name: Aggiornamento Automatico KIRA-BLASTER-MASTER

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Permessi necessari per far funzionare GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: Esegue gli script, genera i file, fa il commit e carica l'artefatto
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Esegue wrapper
        run: |
          python wrapper.py
          
      - name: Cifra gli HTML
        env:
          HTML_PASSWORD: ${{ secrets.HTML_PASSWORD }}
        run: |
          python scripts/encrypt_html.py output
          
      - name: Commit e push dei file generati
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico - $(date '+%Y-%m-%d %H:%M:%S')"
          git push

      # --- PARTE AGGIUNTA PER GITHUB PAGES ---
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output' 

  # JOB 2: Prende l'artefatto e lo pubblica su GitHub Pages
  deploy:
    needs: build # Aspetta che il job 'build' finisca con successo
    runs-on: ubuntu-latest
    # Associa esplicitamente il deploy all'ambiente di GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Il deploy ha bisogno solo di questi permessi specifici
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
