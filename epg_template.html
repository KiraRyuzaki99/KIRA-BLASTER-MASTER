<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guida TV EPG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0f1117; --bg-2:#161922; --bg-3:#1e2230; --bg-4:#2a2f42; --border:#2d3247; --text:#e8eaf0; --text-dim:#8b92a8; --accent:#e94560; --accent-2:#ff6b8a; --accent-dim:#3a1f2b; --live:#ef4444; --new:#f59e0b; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.4; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  .topbar { background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .info-bar { color: var(--text-dim); font-size: 12px; }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input { width: 100%; padding: 9px 14px 9px 36px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: 0.6; pointer-events: none; }
  .toggle-btn { padding: 9px 14px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px; cursor: pointer; font-size: 13px; transition: all 0.15s; white-space: nowrap; }
  .toggle-btn:hover { color: var(--text); border-color: var(--accent); }
  .toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .main { display: grid; grid-template-columns: 260px 1fr; overflow: hidden; }
  .sidebar { background: var(--bg-2); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-header { position: sticky; top: 0; background: var(--bg-2); padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); z-index: 2; }
  .channel-list { flex: 1; overflow-y: auto; }
  .channel-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; }
  .channel-item:hover { background: var(--bg-3); }
  .channel-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
  .channel-item img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: var(--bg-4); padding: 3px; flex-shrink: 0; }
  .channel-item .no-logo { width: 34px; height: 34px; border-radius: 6px; background: var(--bg-4); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .channel-item .name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-item .count { font-size: 10px; color: var(--text-dim); background: var(--bg-4); padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
  .content { overflow-y: auto; background: var(--bg); }
  .channel-hero { background: linear-gradient(135deg, var(--bg-2), var(--bg-3)); border-bottom: 1px solid var(--border); padding: 20px 24px; position: sticky; top: 0; z-index: 5; }
  .channel-hero-inner { display: flex; align-items: center; gap: 16px; max-width: 1000px; }
  .channel-hero img { width: 64px; height: 64px; object-fit: contain; border-radius: 12px; background: var(--bg-4); padding: 6px; }
  .channel-hero .no-logo-lg { width: 64px; height: 64px; border-radius: 12px; background: var(--bg-4); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .channel-hero .hero-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .channel-hero .hero-info .meta { font-size: 12px; color: var(--text-dim); }
  .empty-content { padding: 60px 30px; text-align: center; color: var(--text-dim); }
  .empty-content .big-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.4; }
  .programmes-list { padding: 16px 24px 40px; max-width: 1000px; }
  .programme-item { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 14px 16px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; transition: all 0.15s; cursor: pointer; }
  .programme-item:hover { border-color: var(--bg-4); background: var(--bg-3); }
  .programme-item.current { border-color: var(--accent); background: linear-gradient(135deg, var(--bg-2), var(--accent-dim)); position: relative; }
  .programme-item.current::before { content: ''; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
  .programme-time { display: flex; flex-direction: column; gap: 2px; }
  .programme-time .start { font-size: 15px; font-weight: 700; color: var(--text); }
  .programme-time .stop { font-size: 11px; color: var(--text-dim); }
  .programme-item.current .programme-time .start { color: var(--accent); }
  .programme-body { min-width: 0; }
  .programme-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge.new { background: var(--new); color: #000; }
  .badge.live { background: var(--live); color: white; }
  .programme-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .programme-cat { font-size: 10px; padding: 2px 8px; background: var(--bg-4); color: var(--text-dim); border-radius: 10px; }
  .programme-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .programme-item.expanded .programme-desc { -webkit-line-clamp: unset; display: block; }
  .programme-meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; font-style: italic; display: flex; gap: 10px; flex-wrap: wrap; }
  .no-results { text-align: center; padding: 60px 30px; color: var(--text-dim); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 30vh; } .channel-list { display: flex; overflow-x: auto; gap: 6px; padding: 8px; } .channel-item { flex-direction: column; min-width: 80px; padding: 8px 10px; border-left: none; border-bottom: 2px solid transparent; border-radius: 8px; background: var(--bg-3); } .channel-item.active { border-left: none; border-bottom-color: var(--accent); } .channel-item .name { font-size: 10.5px; text-align: center; white-space: normal; max-width: 80px; } .channel-item .count { display: none; } .programme-item { grid-template-columns: 70px 1fr; gap: 10px; padding: 12px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span>📺</span><span>Guida TV</span></div>
    <div class="info-bar" id="infoBar">—</div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Cerca canale o programma..."></div>
    <button class="toggle-btn" id="nowBtn">🔴 Ora</button>
  </header>
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-header">Canali (<span id="channelCount">0</span>)</div>
      <div class="channel-list" id="channelList"></div>
    </aside>
    <main class="content" id="content">
      <div class="empty-content"><div class="big-icon">👈</div><p>Seleziona un canale</p></div>
    </main>
  </div>
</div>
<script>
var DATA = /*__DATA__*/;
(function(){
  "use strict";
  var state = { channels: DATA.channels, channelMap: {}, selectedChannelId: null, searchTerm: '', nowOnly: false };
  state.channels.forEach(function(ch){
    state.channelMap[ch.id] = ch;
    ch.programmes.forEach(function(p){ p.start = new Date(p.start); p.stop = new Date(p.stop); });
    ch.programmes.sort(function(a,b){ return a.start - b.start; });
  });
  function $(id){ return document.getElementById(id); }
  var channelList = $('channelList'), content = $('content'), searchInput = $('searchInput'), channelCountEl = $('channelCount'), nowBtn = $('nowBtn');
  $('infoBar').textContent = DATA.dateLabel;
  function ft(d){ return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
  function eh(t){ if(t==null) return ''; var d=document.createElement('div'); d.textContent=String(t); return d.innerHTML; }
  function ea(t){ return String(t||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function rcl(){
    var term = state.searchTerm.toLowerCase().trim();
    var chs = state.channels;
    if (term) chs = chs.filter(function(ch){
      if (ch.name.toLowerCase().indexOf(term) !== -1) return true;
      return ch.programmes.some(function(p){ return p.title.toLowerCase().indexOf(term)!==-1 || p.desc.toLowerCase().indexOf(term)!==-1; });
    });
    channelCountEl.textContent = chs.length;
    if (!chs.length){ channelList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12px;">Nessun canale</div>'; return; }
    var frag = document.createDocumentFragment();
    chs.forEach(function(ch){
      var el = document.createElement('div');
      el.className = 'channel-item' + (ch.id === state.selectedChannelId ? ' active' : '');
      var logo = ch.icon ? '<img src="' + ea(ch.icon) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;no-logo&quot;>📺</div>\'">' : '<div class="no-logo">📺</div>';
      el.innerHTML = logo + '<div class="name">' + eh(ch.name) + '</div><div class="count">' + ch.programmes.length + '</div>';
      el.addEventListener('click', function(){ state.selectedChannelId = ch.id; rcl(); rc(); });
      frag.appendChild(el);
    });
    channelList.innerHTML = ''; channelList.appendChild(frag);
    requestAnimationFrame(function(){ var a = channelList.querySelector('.channel-item.active'); if (a) a.scrollIntoView({block:'nearest'}); });
  }
  function rc(){
    if (!state.selectedChannelId){ content.innerHTML = '<div class="empty-content"><div class="big-icon">👈</div><p>Seleziona un canale</p></div>'; return; }
    var ch = state.channelMap[state.selectedChannelId]; if (!ch) return;
    var now = Date.now();
    var progs = ch.programmes.slice();
    if (state.nowOnly) progs = progs.filter(function(p){ return p.start.getTime() <= now && p.stop.getTime() > now; });
    var term = state.searchTerm.toLowerCase().trim();
    if (term && ch.name.toLowerCase().indexOf(term) === -1) progs = progs.filter(function(p){ return p.title.toLowerCase().indexOf(term)!==-1 || p.desc.toLowerCase().indexOf(term)!==-1; });
    var hero = '<div class="channel-hero"><div class="channel-hero-inner">' + (ch.icon ? '<img src="' + ea(ch.icon) + '" alt="">' : '<div class="no-logo-lg">📺</div>') + '<div class="hero-info"><h2>' + eh(ch.name) + '</h2><div class="meta">' + progs.length + ' programmi</div></div></div></div>';
    if (!progs.length){ content.innerHTML = hero + '<div class="no-results"><p>Nessun programma</p></div>'; return; }
    var items = progs.map(function(p){
      var isCur = p.start.getTime() <= now && p.stop.getTime() > now;
      var cats = '';
      if (p.categories && p.categories.length) cats = '<div class="programme-cats">' + p.categories.map(function(c){ return '<span class="programme-cat">' + eh(c) + '</span>'; }).join('') + '</div>';
      var badges = (p.isNew ? '<span class="badge new">Nuovo</span>' : '') + (p.isLive ? '<span class="badge live">Live</span>' : '');
      var meta = '';
      if (p.credits && p.credits.director && p.credits.director.length) meta += '<span>🎬 ' + eh(p.credits.director.join(', ')) + '</span>';
      if (p.date) meta += '<span>📅 ' + eh(p.date) + '</span>';
      return '<div class="programme-item' + (isCur ? ' current' : '') + '"><div class="programme-time"><div class="start">' + ft(p.start) + '</div><div class="stop">→ ' + ft(p.stop) + '</div></div><div class="programme-body"><div class="programme-title">' + eh(p.title) + badges + '</div>' + (p.episodeNum ? '<div class="programme-meta"><span>' + eh(p.episodeNum) + '</span></div>' : '') + cats + (p.desc ? '<div class="programme-desc">' + eh(p.desc) + '</div>' : '') + (meta ? '<div class="programme-meta">' + meta + '</div>' : '') + '</div></div>';
    }).join('');
    content.innerHTML = hero + '<div class="programmes-list">' + items + '</div>';
    content.querySelectorAll('.programme-item').forEach(function(el){ el.addEventListener('click', function(){ this.classList.toggle('expanded'); }); });
    requestAnimationFrame(function(){ var cur = content.querySelector('.programme-item.current'); if (cur) content.scrollTo({ top: Math.max(0, cur.offsetTop - 150), behavior: 'smooth' }); });
  }
  searchInput.addEventListener('input', function(){ state.searchTerm = searchInput.value; rcl(); rc(); });
  nowBtn.addEventListener('click', function(){ state.nowOnly = !state.nowOnly; nowBtn.classList.toggle('active', state.nowOnly); rcl(); rc(); });
  if (state.channels.length) state.selectedChannelId = state.channels[0].id;
  rcl(); rc();
})();
</script>
</body>
</html>
